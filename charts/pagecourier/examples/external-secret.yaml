app:
  publicOrigin: https://pages.example.com
storage:
  bucket: pagecourier-production
  region: us-east-1
extraEnv:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: pagecourier-storage-credentials
        key: access-key-id
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: pagecourier-storage-credentials
        key: secret-access-key
