name: Validate and publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: pagecourier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application and chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.3

      - name: Check types
        run: npm run check

      - name: Check formatting and lint
        run: npm run lint

      - name: Run unit and integration tests
        run: npm run test:unit

      - name: Install Chromium and system dependencies
        run: npm run test:e2e:install -- --with-deps

      - name: Run Node-adapter browser tests
        run: npm run test:e2e

      - name: Test production container against MinIO
        run: npm run test:acceptance

      - name: Lint, package, and render Helm chart
        run: npm run helm:check

      - name: Build production application
        run: npm run build

      - name: Build production container image
        run: |
          docker build \
            --build-arg VERSION=validation \
            --build-arg REVISION="${GITHUB_SHA}" \
            --tag pagecourier:validation \
            .

  publish:
    name: Publish GHCR artifacts
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.versions.outputs.image_tag }}
      chart_version: ${{ steps.versions.outputs.chart_version }}
      artifact_version: ${{ steps.versions.outputs.artifact_version }}
      revision: ${{ steps.versions.outputs.revision }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.3

      - name: Derive artifact versions
        id: versions
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/artifact-version.mjs

      - name: Refuse to overwrite an existing release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.versions.outputs.artifact_version }}
        run: node scripts/check-release-availability.mjs

      - name: Prepare versioned chart
        env:
          CHART_VERSION: ${{ steps.versions.outputs.chart_version }}
          IMAGE_TAG: ${{ steps.versions.outputs.image_tag }}
          REVISION: ${{ steps.versions.outputs.revision }}
          CHART_OUTPUT: ${{ runner.temp }}/pagecourier-chart
        run: node scripts/prepare-chart.mjs

      - name: Package and verify chart
        env:
          CHART_VERSION: ${{ steps.versions.outputs.chart_version }}
          IMAGE_TAG: ${{ steps.versions.outputs.image_tag }}
          REVISION: ${{ steps.versions.outputs.revision }}
          CHART_OUTPUT: ${{ runner.temp }}/pagecourier-chart
          PACKAGE_OUTPUT: ${{ runner.temp }}/pagecourier-packages
        run: |
          mkdir -p "$PACKAGE_OUTPUT"
          helm package "$CHART_OUTPUT" --destination "$PACKAGE_OUTPUT"
          node scripts/verify-chart.mjs \
            "$PACKAGE_OUTPUT/pagecourier-$CHART_VERSION.tgz" \
            "$CHART_VERSION" "$IMAGE_TAG" "$REVISION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GHCR
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_USERNAME" --password-stdin
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "$GHCR_USERNAME" --password-stdin

      - name: Build and publish multi-platform image
        env:
          IMAGE_TAG: ${{ steps.versions.outputs.image_tag }}
          REVISION: ${{ steps.versions.outputs.revision }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$IMAGE_TAG" \
            --build-arg REVISION="$REVISION" \
            --tag "ghcr.io/torstenwerner/pagecourier:$IMAGE_TAG" \
            --label org.opencontainers.image.source=https://github.com/torstenwerner/PageCourier \
            --label org.opencontainers.image.licenses=MIT \
            --label "org.opencontainers.image.version=$IMAGE_TAG" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --push \
            .

      - name: Verify published image manifest and metadata
        env:
          IMAGE_TAG: ${{ steps.versions.outputs.image_tag }}
          REVISION: ${{ steps.versions.outputs.revision }}
          MANIFEST_FILE: ${{ runner.temp }}/pagecourier-manifest.json
          LABELS_FILE: ${{ runner.temp }}/pagecourier-labels.json
        run: |
          IMAGE="ghcr.io/torstenwerner/pagecourier:$IMAGE_TAG"
          docker buildx imagetools inspect --raw "$IMAGE" > "$MANIFEST_FILE"
          docker pull --platform linux/amd64 "$IMAGE"
          docker image inspect --format '{{json .Config.Labels}}' "$IMAGE" > "$LABELS_FILE"
          node scripts/verify-image.mjs \
            "$MANIFEST_FILE" "$LABELS_FILE" "$IMAGE_TAG" "$REVISION"

      - name: Publish OCI Helm chart
        env:
          CHART_VERSION: ${{ steps.versions.outputs.chart_version }}
          PACKAGE_OUTPUT: ${{ runner.temp }}/pagecourier-packages
        run: |
          helm push \
            "$PACKAGE_OUTPUT/pagecourier-$CHART_VERSION.tgz" \
            oci://ghcr.io/torstenwerner/charts

      - name: Verify public, unauthenticated artifact consumption
        env:
          IMAGE_TAG: ${{ steps.versions.outputs.image_tag }}
          CHART_VERSION: ${{ steps.versions.outputs.chart_version }}
          PUBLIC_CHECK_DIR: ${{ runner.temp }}/pagecourier-public-check
        run: |
          docker logout ghcr.io
          helm registry logout ghcr.io
          if ! docker pull "ghcr.io/torstenwerner/pagecourier:$IMAGE_TAG"; then
            echo "::error::The image was published but is not publicly pullable. Set GHCR package visibility to public and grant this repository Actions access before retrying verification."
            exit 1
          fi
          mkdir -p "$PUBLIC_CHECK_DIR"
          if ! helm pull \
            oci://ghcr.io/torstenwerner/charts/pagecourier \
            --version "$CHART_VERSION" \
            --destination "$PUBLIC_CHECK_DIR"; then
            echo "::error::The chart was published but is not publicly pullable. Set GHCR package visibility to public and grant this repository Actions access before retrying verification."
            exit 1
          fi
          node scripts/verify-chart.mjs \
            "$PUBLIC_CHECK_DIR/pagecourier-$CHART_VERSION.tgz" \
            "$CHART_VERSION" "$IMAGE_TAG" "${{ github.sha }}"
